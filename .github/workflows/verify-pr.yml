name: Verify pull request
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:checks
        env:
          GITHUB_PAGES: "true"
      - run: pnpm build
        env:
          GITHUB_PAGES: "true"
          VITE_SUPABASE_URL: "http://127.0.0.1:54321"
          VITE_SUPABASE_PUBLISHABLE_KEY: "isolated-ci-build"
      # Cloud Auth is an explicit isolated-project gate, never a production CI probe.
